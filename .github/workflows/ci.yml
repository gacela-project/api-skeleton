# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

on:
  pull_request:
  push:
    branches:
      - main

name: CI

jobs:

  coding-guidelines:
    name: Coding Guidelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --no-ansi --no-progress

      - name: Run friendsofphp/php-cs-fixer
        run: ./vendor/bin/php-cs-fixer fix --allow-risky=yes --dry-run --show-progress=dots --using-cache=no --verbose

  type-checker:
    name: Type Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer update --no-interaction --no-ansi --no-progress

      - name: Run psalm
        run: ./vendor/bin/psalm --config=psalm.xml --no-progress --show-info=false --stats --output-format=github

      - name: Run phpstan
        run: ./vendor/bin/phpstan analyze -c phpstan.neon src

  tests:
    name: "PHP ${{ matrix.php-version }}, deps ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [ "lowest", "highest" ]
        php-version: [ "8.1", "8.2", "8.3", "8.4" ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer

      - name: "Install lowest dependencies"
        if: ${{ matrix.dependencies == 'lowest' }}
        run: composer update --prefer-lowest --no-interaction --no-progress

      - name: "Install highest dependencies"
        if: ${{ matrix.dependencies == 'highest' }}
        run: composer update --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t gacela-api .

      - name: Smoke-test the container
        run: |
          docker run -d --rm -p 8080:80 --name gacela-api gacela-api
          sleep 3
          curl --fail --silent http://localhost:8080/health
          docker stop gacela-api
