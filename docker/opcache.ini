opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; Production: files are snapshotted at startup — restart PHP after each deploy.
opcache.validate_timestamps=0
; OPcache preloading is an opt-in prod tuning — see the Performance section of
; the README for the opcache.preload / GACELA_PRELOAD_USER_FILES wiring.
